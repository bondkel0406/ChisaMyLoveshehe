    const frames = {
      login: document.getElementById('frame-login'),
      signup: document.getElementById('frame-signup'),
      app: document.getElementById('frame-app')
    };

    frames.login.srcdoc = LOGIN_HTML;
    frames.signup.srcdoc = SIGNUP_HTML;
    frames.app.srcdoc = APP_HTML;

    function showScreen(name) {
      Object.values(frames).forEach(f => f.classList.remove('visible'));
      frames[name].classList.add('visible');
    }

    // Each iframe posts a message up to this parent when it wants
    // to hand off to a different screen (login -> app, signup -> login, etc.)
    window.addEventListener('message', (event) => {
      switch (event.data) {
        case 'login:success':
          showScreen('app');
          break;
        case 'login:goSignup':
          showScreen('signup');
          break;
        case 'signup:success':
        case 'signup:goLogin':
          showScreen('login');
          break;
        case 'app:logout':
          showScreen('login');
          break;
      }
    });
  </script>
